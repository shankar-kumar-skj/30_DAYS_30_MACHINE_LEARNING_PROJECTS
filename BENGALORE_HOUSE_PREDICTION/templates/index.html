<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HOUSE PRICE PREDICTOR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  </head>
  <body class="bg-dark text-white">
    <div class="container">
      <div class="row">
        <div class="card" style="width: 100%; margin-top: 50px;">
          <div class="card-header text-center">
            <h1>Welcome to Bangalore House Price Predictor</h1>
          </div>
          <div class="card-body">
            <form id="prediction-form" onsubmit="return send_data(event)">
              <div class="row">
                <div class="col-md-6 form-group text-center">
                  <label><b>Select the Location:</b></label>
                  <select class="form-control" id="location" name="location" required>
                    {% for location in locations %}
                      <option value="{{ location }}">{{ location }}</option>
                    {% endfor %}
                  </select>
                </div>
                <div class="col-md-6 form-group text-center">
                  <label><b>Enter BHK:</b></label>
                  <input type="number" class="form-control" id="bhk" name="bhk" placeholder="Enter number of BHK" required>
                </div>
                <div class="col-md-6 form-group text-center">
                  <label><b>Enter Bathrooms:</b></label>
                  <input type="number" class="form-control" id="bath" name="bath" placeholder="Enter number of Bathrooms" required>
                </div>
                <div class="col-md-6 form-group text-center">
                  <label><b>Enter Square Feet:</b></label>
                  <input type="number" class="form-control" id="total_sqft" name="total_sqft" placeholder="Enter total Square Feet" required>
                </div>
                <div class="col-md-12 form-group text-center mt-3">
                  <button type="submit" class="btn btn-primary">Predict Price</button>
                </div>
              </div>
            </form>

            <br>
            <div class="col-md-12 text-center">
              <h3><span id="prediction"></span></h3>
            </div>

            <script>
              function send_data(event) {
                event.preventDefault();

                const form = document.getElementById('prediction-form');
                const fd = new FormData(form);
                const xhr = new XMLHttpRequest();

                document.getElementById("prediction").innerHTML = "Waiting for prediction...";

                xhr.open('POST', '/predict', true);

                xhr.onreadystatechange = function () {
                  if (xhr.readyState === XMLHttpRequest.DONE) {
                    if (xhr.status === 200) {
                      document.getElementById('prediction').innerHTML = "Prediction: ₹ " + xhr.responseText;
                    } else {
                      document.getElementById('prediction').innerHTML = "Error occurred during prediction.";
                    }
                  }
                };

                xhr.send(fd);
                return false;
              }
            </script>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
